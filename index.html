<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#0c0d0e"><meta name="description" content="Seu novo cardápio digital de pizzas."><link rel="manifest" href="manifest.json"><title>Império Pizzaria e Esfiharia • Cardápio digital</title><style>
*{box-sizing:border-box}body{margin:0;background:#0c0d0e;color:#fff;font:16px Arial,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0}button:focus-visible,input:focus-visible{outline:2px solid #ffca35}a{color:inherit}main{max-width:1150px;margin:auto;padding:24px 24px 105px}header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:24px}.brand{font-size:27px;font-weight:900;letter-spacing:-1px;line-height:.9}.brand span{color:#ffcb35;font-style:italic}.brand small{display:block;color:#a5a5a5;font-size:10px;letter-spacing:4px;margin-top:7px}.tag{color:#ccc;font-size:14px}.icon{background:#202224;color:white;border-radius:50%;width:44px;height:44px}.row{display:flex;gap:10px;align-items:center}.search{display:flex;background:#202224;border-radius:16px;padding:13px 17px;margin:0 0 20px;gap:10px;color:#ffcb35}.search input{background:none;border:none;color:white;flex:1;min-width:0;outline:none}.hero{isolation:isolate;position:relative;overflow:hidden;min-height:320px;border:1px solid #343434;border-radius:24px;display:flex;align-items:center;padding:32px;background:#23160e}.hero:before{content:'';position:absolute;inset:0;z-index:-1;background:linear-gradient(90deg,#090909 8%,#0a0a0ad9 30%,#09090928 80%),url('https://images.unsplash.com/photo-1574071318508-1cdbab80d002?auto=format&fit=crop&w=1500&q=85') center 53%/cover}.hero h1{font-size:clamp(36px,6vw,66px);line-height:.98;letter-spacing:-2px;margin:10px 0 15px}.hero h1 em{color:#ffcb35}.eyebrow{color:#ffcb35;font-size:14px;font-weight:800;letter-spacing:2px}.hero p{color:#eee;max-width:320px;line-height:1.5}.primary{background:#ffcb35;color:#101010;border-radius:12px;padding:14px 20px;font-weight:800}.categories{display:flex;gap:12px;overflow:auto;padding:22px 0 10px;scrollbar-width:none}.cat{flex:1;min-width:106px;border:1px solid #242629;background:#191b1e;color:#eee;padding:14px 10px;border-radius:18px;font-weight:700;white-space:nowrap}.cat i{display:block;font-style:normal;font-size:32px;margin-bottom:8px}.cat.active{background:#ffcb35;color:#101010;border-color:#ffcb35}.section{display:flex;justify-content:space-between;align-items:center;margin:25px 0 14px}.section h2{font-size:24px;margin:0}.section span{color:#aaa;font-size:14px}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:15px}.card{background:#191b1f;border:1px solid #2a2c2f;border-radius:16px;overflow:hidden;position:relative}.photo{height:170px;background:#33251e center/cover;cursor:pointer}.heart{position:absolute;top:9px;right:9px;border-radius:50%;background:#0b0b0baa;color:#fff;width:36px;height:36px;font-size:22px}.heart.on{color:#ffcb35}.details{padding:13px}.details h3{font-size:17px;margin:0 0 7px}.details p{font-size:13px;line-height:1.4;color:#b6b6b6;margin:0 0 12px;min-height:36px}.price{display:flex;align-items:center;justify-content:space-between;gap:7px;color:#ffcb35;font-weight:800}.add{background:#ffcb35;color:#101010;border-radius:50%;width:35px;height:35px;font-size:24px;font-weight:700}.offer{margin:24px 0;background:linear-gradient(90deg,#211807,#141414);border:1px solid #55442a;padding:22px;border-radius:18px;display:flex;align-items:center;justify-content:space-between;gap:15px}.offer h2{margin:6px 0;font-size:26px;color:#ffcb35}.offer p{margin:0;color:#eee}.bottom{position:fixed;bottom:0;left:0;right:0;z-index:3;background:#151719ed;backdrop-filter:blur(16px);border-top:1px solid #303030;padding:10px max(18px,calc((100vw - 1100px)/2)) calc(10px + env(safe-area-inset-bottom));display:flex;justify-content:space-around;align-items:center;gap:12px}.nav{background:none;color:#aeb0b2;font-size:12px;text-align:center;min-width:50px}.nav b{display:block;font-size:23px;margin-bottom:4px}.nav.active{color:#ffcb35}.cartBtn{background:#ffcb35;color:#111;padding:11px 17px;border-radius:12px;font-weight:800}.modal{display:none;position:fixed;inset:0;z-index:10;background:#000b;align-items:flex-end;justify-content:center}.modal.open{display:flex}.panel{background:#191b1e;border:1px solid #3a3a3a;border-radius:22px 22px 0 0;padding:24px;width:min(100%,540px);max-height:90vh;overflow:auto}.panel h2{margin:0 0 15px}.panel label{display:block;color:#ddd;font-size:14px;margin:12px 0 7px}.panel input,.panel select,.panel textarea{width:100%;padding:12px;border:1px solid #454545;border-radius:10px;background:#101113;color:white}.panel .primary{width:100%;margin-top:16px}.close{float:right;background:#303236;color:#fff;border-radius:50%;width:34px;height:34px}.line{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid #333;gap:12px}.qty button{background:#303236;color:white;border-radius:7px;padding:6px 10px}.notice{padding:12px;border:1px solid #57492b;border-radius:10px;background:#292217;color:#f4d77f;font-size:13px;line-height:1.5}.empty{text-align:center;color:#aaa;padding:30px}.small{font-size:13px;color:#aaa}.hidden{display:none!important}.preview-img{width:100%;height:180px;border-radius:12px;object-fit:cover}footer{margin-top:30px;color:#777;text-align:center;font-size:13px}@media(max-width:760px){main{padding:16px 15px 100px}.tag{display:none}.hero{min-height:235px;padding:21px}.hero p{font-size:14px;max-width:190px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.photo{height:138px}.details{padding:11px}.details h3{font-size:15px}.details p{font-size:12px;min-height:34px}.cat{min-width:90px;font-size:13px}.section h2{font-size:20px}.offer{padding:17px}.offer h2{font-size:21px}.offer .primary{padding:11px}.brand{font-size:25px}.bottom{gap:3px}.cartBtn{font-size:13px;padding:12px 9px}}@media(min-width:761px){.modal{align-items:center}.panel{border-radius:22px}}
</style></head><body><main><header><div class="brand">IMPÉRIO <span>PIZZARIA</span><small>ESFIHARIA & PIZZARIA</small></div><div class="tag">Escolha seu sabor favorito.</div><div class="row"><button class="icon" aria-label="Instalar aplicativo" onclick="installApp()">↓</button><button class="icon" aria-label="Meus dados" onclick="profile()">♙</button></div></header><div class="search">⌕ <input id="search" placeholder="Busque seu sabor favorito" aria-label="Buscar sabores"></div><section class="hero"><div><div class="eyebrow">IMPÉRIO PIZZARIA E ESFIHARIA</div><h1>Pizza quente.<br><em>Sabor de verdade.</em></h1><p>Conheça nossas pizzas salgadas e doces e escolha a sua favorita.</p><button class="primary" onclick="filter('Salgadas')">Ver sabores</button></div></section><div class="categories" id="cats"></div><div class="section"><h2 id="heading">Pizzas salgadas</h2><span id="count"></span></div><div class="grid" id="grid"></div><footer>Império Pizzaria e Esfiharia • Imagens ilustrativas<br>Desenvolvido por Click Forge</footer></main><nav class="bottom"><button class="nav active" onclick="filter('Salgadas');scrollTo(0,0)"><b>⌂</b>Início</button><button class="nav" onclick="filter('Favoritos')"><b>♡</b>Favoritos</button><button class="nav" onclick="profile()"><b>♙</b>Meus dados</button><button class="cartBtn" onclick="showCart()">🛍 Sacola (<span id="cartCount">0</span>)</button></nav><div class="modal" id="modal" onclick="if(event.target===this)closeModal()"><section class="panel" id="panel"></section></div><script>
const pics={pizza:'https://images.unsplash.com/photo-1574071318508-1cdbab80d002?auto=format&fit=crop&w=650&q=80',pep:'https://images.unsplash.com/photo-1628840042765-356cda07504e?auto=format&fit=crop&w=650&q=80',mar:'https://images.unsplash.com/photo-1604068549290-dea0e4a305ca?auto=format&fit=crop&w=650&q=80',four:'https://images.unsplash.com/photo-1571407970349-bc81e7e96d47?auto=format&fit=crop&w=650&q=80',sweet:'https://images.unsplash.com/photo-1513104890138-7c749659a591?auto=format&fit=crop&w=650&q=80',drink:'https://images.unsplash.com/photo-1629203851122-3726ecdf080e?auto=format&fit=crop&w=650&q=80'};
const items=[["Mussarela","Mussarela, tomate, azeitona e orégano","Salgadas","mar"],["2 Queijos","Mussarela, catupiry, azeitona e orégano","Salgadas","four"],["Calabresa","Calabresa, cebola, azeitonas e orégano","Salgadas","pep"],["Mexicana","Mussarela, frango, cebola, mix de pimentas, azeitona e orégano","Salgadas","pizza"],["Palmito","Palmito, mussarela, azeitona e orégano","Salgadas","pizza"],["Mista","Presunto, mussarela, azeitona e orégano","Salgadas","pizza"],["Pernil","Pernil suíno, mussarela, cebolas, azeitona e orégano","Salgadas","pizza"],["Milho e Bacon","Mussarela, milho verde, bacon, azeitona e orégano","Salgadas","pizza"],["Cowboy","Frango, mussarela, cebolas, barbecue, azeitona e orégano","Salgadas","pizza"],["Alho e Óleo","Mussarela, alho frito, azeite, azeitona e orégano","Salgadas","four"],["Brigadeiro","Chocolate ao leite e granulado","Doces","sweet"],["Romeu e Julieta","Mussarela e goiabada cremosa","Doces","sweet"],["Brigadeiro Branco","Chocolate branco e granulado branco","Doces","sweet"],["Chocolate ao Leite","Chocolate ao leite","Doces","sweet"],["Chocolate Branco","Chocolate branco","Doces","sweet"],["Prestígio","Chocolate ao leite e coco ralado","Doces","sweet"],["Paçoca","Chocolate ao leite com amendoim granulado","Doces","sweet"]].map((x,id)=>({id,name:x[0],desc:x[1],cat:x[2],pic:pics[x[3]]}));
const cats=[['Salgadas','🍕'],['Doces','🍫']];let category='Salgadas',cart=JSON.parse(localStorage.imperioPizzaCart||'[]'),favorites=JSON.parse(localStorage.imperioPizzaFav||'[]'),customer=JSON.parse(localStorage.imperioPizzaCustomer||'{}');const el=id=>document.getElementById(id);const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function save(){localStorage.imperioPizzaCart=JSON.stringify(cart);localStorage.imperioPizzaFav=JSON.stringify(favorites);el('cartCount').textContent=cart.reduce((a,b)=>a+b.qty,0)}
function filter(c){category=c;render();el('heading').scrollIntoView({behavior:'smooth',block:'start'})}
function render(){el('cats').innerHTML=cats.map(([c,i])=>`<button class="cat ${category===c?'active':''}" onclick="filter('${c}')"><i>${i}</i>Pizzas ${c.toLowerCase()}</button>`).join('');let q=el('search').value.toLowerCase();let list=items.filter(p=>(q||category==='Favoritos'&&favorites.includes(p.id)||p.cat===category)&&`${p.name} ${p.desc}`.toLowerCase().includes(q));if(category==='Favoritos')list=list.filter(p=>favorites.includes(p.id));el('heading').textContent=q?'Resultados da busca':category==='Favoritos'?'Meus favoritos':'Pizzas '+category.toLowerCase();el('count').textContent=list.length+' sabores';el('grid').innerHTML=list.map(p=>`<article class="card"><div class="photo" style="background-image:url('${p.pic}')" role="button" tabindex="0" onclick="detail(${p.id})" onkeydown="if(event.key==='Enter')detail(${p.id})"></div><button class="heart ${favorites.includes(p.id)?'on':''}" aria-label="Favoritar ${p.name}" onclick="fav(${p.id})">${favorites.includes(p.id)?'♥':'♡'}</button><div class="details"><h3>${p.name}</h3><p>${p.desc}</p><div class="price"><span>${p.cat}</span><button class="add" aria-label="Adicionar ${p.name}" onclick="detail(${p.id})">+</button></div></div></article>`).join('')||'<div class="empty">Nenhum sabor encontrado.</div>';save()}
function fav(id){favorites=favorites.includes(id)?favorites.filter(i=>i!==id):[...favorites,id];render()}
function openModal(html){el('panel').innerHTML='<button class="close" aria-label="Fechar" onclick="closeModal()">×</button>'+html;el('modal').classList.add('open')}
function closeModal(){el('modal').classList.remove('open')}
function detail(id){const p=items[id];openModal(`<h2>${p.name}</h2><img class="preview-img" src="${p.pic}" alt="Imagem ilustrativa de pizza"><p>${p.desc}</p><label>Segundo sabor (meio a meio)</label><select id="half"><option value="">Pizza inteira</option>${items.filter(x=>x.cat===p.cat&&x.id!==id).map(x=>`<option value="${x.id}">${x.name}</option>`).join('')}</select><label>Borda</label><select id="crust"><option>Tradicional</option><option>Recheada (consultar opções)</option></select><label>Observações</label><textarea id="note" placeholder="Ex.: sem cebola"></textarea><button class="primary" onclick="add(${id})">Adicionar à sacola</button>`)}
function add(id){const p=items[id],h=el('half').value,crust=el('crust').value;let name=p.name+(h===''?'':' • ½ '+items[+h].name)+(crust==='Tradicional'?'':' • '+crust);cart.push({name,qty:1,note:el('note').value});save();closeModal()}
function showCart(){openModal(`<h2>Minha sacola</h2>${cart.length?cart.map((p,i)=>`<div class="line"><div><strong>${esc(p.name)}</strong><br><span class="small">${esc(p.note)}</span></div><div class="qty"><button onclick="qty(${i},-1)">−</button> ${p.qty} <button onclick="qty(${i},1)">+</button></div></div>`).join('')+'<button class="primary" onclick="checkout()">Continuar pedido</button>':'<p class="empty">Sua sacola está vazia.</p><button class="primary" onclick="closeModal()">Escolher pizza</button>'}`)}
function qty(i,n){cart[i].qty+=n;if(cart[i].qty<1)cart.splice(i,1);save();showCart()}
function fields(){return `<label>Nome</label><input id="name" value="${esc(customer.name)}" required><label>WhatsApp</label><input id="phone" type="tel" value="${esc(customer.phone)}" required><label>Recebimento</label><select id="mode" onchange="el('address').classList.toggle('hidden',this.value==='Retirada')"><option>Entrega</option><option>Retirada</option></select><div id="address"><label>Rua</label><input id="street" value="${esc(customer.street)}"><label>Número (ou S/N)</label><input id="number" value="${esc(customer.number)}"><label>Bairro</label><input id="district" value="${esc(customer.district)}"><label>Cidade</label><input id="city" value="${esc(customer.city)}"><label>Referência</label><input id="ref" value="${esc(customer.ref)}"></div>`}function persist(){for(const k of ['name','phone','street','number','district','city','ref'])customer[k]=el(k).value.trim();localStorage.imperioPizzaCustomer=JSON.stringify(customer)}function profile(){openModal(`<h2>Meus dados</h2>${fields()}<button class="primary" onclick="persist();closeModal()">Salvar dados neste aparelho</button>`)}
function checkout(){openModal(`<h2>Finalizar pedido</h2>${fields()}<button class="primary" onclick="submitOrder()">Gerar resumo do pedido</button>`)}
function submitOrder(){persist();const mode=el('mode').value;if(!customer.name||!customer.phone||(mode==='Entrega'&&(!customer.street||!customer.number||!customer.district||!customer.city))){alert('Preencha os dados obrigatórios.');return}const msg=['PEDIDO — IMPÉRIO PIZZARIA',customer.name,customer.phone,mode,mode==='Entrega'?[customer.street,customer.number,customer.district,customer.city,customer.ref].join(', '):'',...cart.map(p=>`${p.qty}x ${p.name} ${p.note}`)].filter(Boolean).join('\n');openModal(`<h2>Resumo do pedido</h2><textarea rows="10" readonly>${esc(msg)}</textarea><p class="notice">O envio de pedidos será ativado na configuração final.</p><button class="primary" onclick="navigator.clipboard.writeText(document.querySelector('.panel textarea').value).then(()=>alert('Resumo copiado!'))">Copiar resumo</button>`)}
let promptInstall;window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();promptInstall=e});function installApp(){if(promptInstall){promptInstall.prompt();promptInstall=null}else alert('No navegador, abra o menu e escolha Adicionar à tela inicial ou Instalar aplicativo.')}el('search').addEventListener('input',render);render();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});

</script></body></html>
